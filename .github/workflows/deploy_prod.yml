# The app is hosted ion VPS server. So basically we SSH into it and run the deploy script (git pull etc.)
name: Deploy Production

on:
  workflow_run:
    workflows:
      - tests
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-slim

    steps:
      # Login to Server via SSH and run deploy script to deploy
      - name: Deploy to production server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.HOST_IP }}
          username: ${{ secrets.HOST_USER }}
          key: ${{ secrets.MY_PRIVATE_KEY}}
          script: |
            #!/bin/sh
            # This will run common commands to deploy a latest commit from remote
            # This script is intended for subsequent deploy of the applications. For 
            # first deploy, consult this project's wiki.
            set -e

            cd htdocs/api.waktusolat.app

            git pull
            composer install --no-dev --optimize-autoloader

            php artisan migrate --force

            # Optimization https://laravel.com/docs/11.x/deployment#optimization
            php artisan optimize:clear 

            npm ci
            npm run build 

            php artisan scribe:generate

            php artisan optimize 

            echo 'Deployment successful.'
