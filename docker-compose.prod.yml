services:
  app:
    build:
      context: .
      dockerfile: .docker/production/Dockerfile
    ports:
      - "8080:8080"
      - "8443:8443"
    post_start:
      - command: php artisan scribe:generate
    environment:
      - PHP_OPCACHE_ENABLE=1
      # app key can be set in environment eg export APP_KEY="base64:your_generated_key_here"
      - APP_KEY=${APP_KEY:?APP_KEY must be set}
      - APP_URL=http://127.0.0.1:8080
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=waktusolat
      - DB_USERNAME=root
      - DB_PASSWORD=
    depends_on:
      - db
  db:
    image: mysql:8.0
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
